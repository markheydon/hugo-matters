version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Europe/London
    open-pull-requests-limit: 5
    labels:
      - dependencies
    assignees:
      - markheydon
    ignore:
      # Microsoft.OpenApi 3.x is not compatible with ASP.NET Core 10; stay on 2.x until a future ASP.NET release.
      - dependency-name: Microsoft.OpenApi
        update-types:
          - version-update:semver-major
    groups:
      test-packages:
        patterns:
          - coverlet.*
          - Microsoft.AspNetCore.Mvc.Testing
          - Microsoft.NET.Test.Sdk
          - Microsoft.Playwright
          - NSubstitute
          - xunit.*
        update-types:
          - minor
          - patch
      microsoft-extensions:
        patterns:
          - Microsoft.Extensions.*
        update-types:
          - minor
          - patch
      azure:
        patterns:
          - Azure.*
        update-types:
          - minor
          - patch
      opentelemetry:
        patterns:
          - OpenTelemetry.*
        update-types:
          - minor
          - patch
      analyzers:
        patterns:
          - "*[Aa]nalyzers*"
          - Microsoft.CodeAnalysis.*
        update-types:
          - minor
          - patch
      other:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Europe/London
    open-pull-requests-limit: 5
    labels:
      - dependencies
    assignees:
      - markheydon
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: devcontainers
    directory: /.devcontainer
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Europe/London
    open-pull-requests-limit: 5
    labels:
      - dependencies
    assignees:
      - markheydon
    groups:
      devcontainers:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /src/HugoMatters.Web
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Europe/London
    open-pull-requests-limit: 5
    labels:
      - dependencies
    assignees:
      - markheydon
    groups:
      npm-dependencies:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
